experiment:
  code: yahoo_pilot_validation_v1
  classification: PILOT_ONLY
  name: Bounded Yahoo pilot validation v1

dataset:
  study_id: d608a16b-b586-44ea-bcdc-d930957bdeeb
  provider: yahoo_finance_v1
  timeframe: D1

window_lengths: [16, 32, 64]
outcome_horizons: [5, 10, 20]

similarity_methods:
  - shape_euclidean_v1
  - shape_correlation_v1
  - dna_cosine_v1
  - dna_robust_cosine_v1
  - dna_robust_euclidean_v1
  - dna_group_balanced_v1
  - market_analogue_v1
  - shape_dna_context_v2
  - episode_diverse_analogue_v1

baselines:
  - random_history_v1
  - same_instrument_random_v1
  - same_asset_class_random_v1
  - same_context_random_v1
  - context_filter_random_v1
  - unconditional_outcome_v1
  - naive_continuation_v1
  - naive_mean_reversion_v1

neighbour_counts: [10, 20]
weighting: [uniform_v1]
episode_caps: [1]

study_arms:
  - same_instrument
  - same_asset_class
  - cross_asset

validation:
  historical_as_of: true
  purge_overlaps: true
  development_fraction: 0.70
  validation_fraction: 0.30
  query_sample_per_instrument_window: 1
  candidate_sample_limit: 500
  temporal_embargo_bars: 0

statistics:
  bootstrap_method: time_block
  bootstrap_iterations: 500
  confidence_level: 0.95
  multiple_testing_correction: benjamini_hochberg

resource_limits:
  serial_execution: true
  maximum_parallel_workers: 1
  resource_guard: true
  min_available_ram_mb: 1024
  min_free_swap_mb: 512
  min_free_disk_gb: 15
  maximum_evaluated_configurations: 150

random:
  seed: 1729
