    "description": "Bounded Alpha Vantage D1 acquisition manifest for Phase 1 Step 10A.3 independent replication. Alpha Vantage is an independent, non-Yahoo public market-data provider used solely to test whether the Yahoo pilot's same-instrument robust Market DNA retrieval effect reproduces on genuinely independent historical data. Gold, Silver, and Copper are intentionally excluded: Alpha Vantage has no daily continuous-futures OHLC series for precious metals, and its free-tier COPPER series is a monthly/global price index, not daily OHLC. Equity ETFs (SPY, QQQ, DIA, IWM) are also excluded from this bounded run: Alpha Vantage's free tier gates outputsize=full (multi-year daily history) behind a premium subscription for TIME_SERIES_DAILY, and the free outputsize=compact fallback returns only the last 100 daily bars, far short of the study's minimum row/window-length requirements. This decision was made from a pre-acquisition dry-run smoke test, before any real replication data was touched -- not after seeing replication results. The confirmatory universe for this run is therefore 6 instruments across 2 asset classes: 4 FX pairs and 2 crypto pairs, both of which support full free-tier daily history. These are documented exclusions, not silent substitutions."
  },
