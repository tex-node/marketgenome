services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=2GB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - autovacuum_work_mem=64MB
      - -c
      - max_connections=30
      - -c
      - max_parallel_workers=1
      - -c
      - max_parallel_workers_per_gather=0
      - -c
      - max_worker_processes=4
      - -c
      - wal_buffers=16MB
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-market_genome}
      POSTGRES_USER: ${POSTGRES_USER:-market_genome}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - ${MARKET_GENOME_POSTGRES_ROOT:-/opt/market-genome/data/postgres}:/var/lib/postgresql/data
      - ${MARKET_GENOME_BACKUP_ROOT:-/opt/market-genome/data/backups}:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-market_genome} -d ${POSTGRES_DB:-market_genome}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ${MARKET_GENOME_REDIS_ROOT:-/opt/market-genome/data/redis}:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../../..
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      MARKET_GENOME_DATABASE_URL: ${MARKET_GENOME_DATABASE_URL}
      MARKET_GENOME_REDIS_URL: ${MARKET_GENOME_REDIS_URL:-redis://redis:6379/0}
      MARKET_GENOME_DATA_ROOT: ${MARKET_GENOME_DATA_ROOT:-/opt/market-genome/data}
      MARKET_GENOME_REPORT_ROOT: ${MARKET_GENOME_REPORT_ROOT:-/opt/market-genome/reports}
      MARKET_GENOME_LOG_LEVEL: ${MARKET_GENOME_LOG_LEVEL:-INFO}
      MARKET_GENOME_MIN_AVAILABLE_RAM_MB: ${MARKET_GENOME_MIN_AVAILABLE_RAM_MB:-1024}
      MARKET_GENOME_MIN_FREE_SWAP_MB: ${MARKET_GENOME_MIN_FREE_SWAP_MB:-512}
    volumes:
      - ${MARKET_GENOME_DATA_ROOT:-/opt/market-genome/data}:/opt/market-genome/data
      - ${MARKET_GENOME_REPORT_ROOT:-/opt/market-genome/reports}:/opt/market-genome/reports
      - ${MARKET_GENOME_LOG_ROOT:-/opt/market-genome/logs}:/opt/market-genome/logs
    ports:
      - "${MARKET_GENOME_API_BIND:-127.0.0.1:8000}:8000"
    command: ["python", "-m", "uvicorn", "market_genome_api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD-SHELL", "python - <<'PY'\nimport urllib.request\nurllib.request.urlopen('http://localhost:8000/health', timeout=5)\nPY"]
      interval: 30s
      timeout: 10s
      retries: 5

  worker:
    build:
      context: ../../..
    mem_limit: ${MARKET_GENOME_WORKER_MEM_LIMIT:-4200m}
    memswap_limit: ${MARKET_GENOME_WORKER_MEMSWAP_LIMIT:-4200m}
    restart: "no"
    profiles: ["cli"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      MARKET_GENOME_DATABASE_URL: ${MARKET_GENOME_DATABASE_URL}
      MARKET_GENOME_REDIS_URL: ${MARKET_GENOME_REDIS_URL:-redis://redis:6379/0}
      MARKET_GENOME_DATA_ROOT: ${MARKET_GENOME_DATA_ROOT:-/opt/market-genome/data}
      MARKET_GENOME_REPORT_ROOT: ${MARKET_GENOME_REPORT_ROOT:-/opt/market-genome/reports}
      MARKET_GENOME_LOG_LEVEL: ${MARKET_GENOME_LOG_LEVEL:-INFO}
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-}
    volumes:
      - ${MARKET_GENOME_DATA_ROOT:-/opt/market-genome/data}:/opt/market-genome/data
      - ${MARKET_GENOME_REPORT_ROOT:-/opt/market-genome/reports}:/opt/market-genome/reports
      - ${MARKET_GENOME_LOG_ROOT:-/opt/market-genome/logs}:/opt/market-genome/logs
    command: ["market-genome", "--help"]
